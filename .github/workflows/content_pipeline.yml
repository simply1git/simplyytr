name: YouTubBot Content Pipeline
on:
  schedule:
    # Trigger every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      force_count:
        description: 'Number of videos to generate (default: 1)'
        required: false
        default: '1'

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Content Pipeline
        run: |
          TARGET_URL="${{ secrets.VERCEL_API_URL || secrets.VERCEL_URL || 'https://simplyytr.vercel.app' }}"
          SECRET_KEY="${{ secrets.PIPELINE_SECRET || 'youtubbot_secure_pipeline_key_2026' }}"
          
          echo "Triggering pipeline at: $TARGET_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${TARGET_URL%/}/api/pipeline/trigger" \
            -H "Authorization: Bearer $SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{"count": ${{ github.event.inputs.force_count || 1 }}}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Pipeline trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Pipeline triggered successfully"

  sync-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only sync analytics at midnight UTC (first cron run of the day)
    if: github.event.schedule == '0 */6 * * *'
    steps:
      - name: Sync YouTube Analytics
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" = "00" ]; then
            TARGET_URL="${{ secrets.VERCEL_API_URL || secrets.VERCEL_URL || 'https://simplyytr.vercel.app' }}"
            SECRET_KEY="${{ secrets.PIPELINE_SECRET || 'youtubbot_secure_pipeline_key_2026' }}"
            curl -s -X POST \
              "${TARGET_URL%/}/api/cron/analytics" \
              -H "Authorization: Bearer $SECRET_KEY"
            echo "✅ Analytics sync triggered"
          else
            echo "⏭️ Skipping analytics sync (not midnight UTC)"
          fi

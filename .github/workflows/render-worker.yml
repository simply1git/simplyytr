name: SIMPLYYTR Zero-Cost Headless Render Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Specific RenderJob ID to process (optional)'
        required: false
      render_mode:
        description: 'Render Mode: split_screen, renarration, or standard'
        required: false
        default: 'renarration'

jobs:
  headless-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 requests srt edge-tts Pillow yt-dlp

      - name: Execute Autonomous Video Generation
        env:
          VERCEL_API_URL: ${{ secrets.VERCEL_API_URL || 'https://simplyytr.vercel.app' }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "======================================================="
          echo "   SIMPLYYTR GITHUB ACTIONS HEADLESS RENDERING NODE   "
          echo "======================================================="
          python -u kaggle-worker/video_generator.py

      - name: Log Node Completion
        run: echo "✅ Headless rendering job completed successfully at $(date -u)"

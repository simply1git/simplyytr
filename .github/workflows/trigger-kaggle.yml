name: Auto-Trigger Kaggle Video Worker

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Verify Secrets Exist
        run: |
          if [ -z "${{ secrets.KAGGLE_USERNAME }}" ]; then
            echo "::error::KAGGLE_USERNAME secret is empty!"
            exit 1
          else
            echo "✅ KAGGLE_USERNAME is set"
          fi
          
          if [ -z "${{ secrets.KAGGLE_KEY }}" ]; then
            echo "::error::KAGGLE_KEY secret is empty!"
            exit 1
          else
            echo "✅ KAGGLE_KEY is set"
          fi

      - name: Push and trigger Kaggle kernel
        run: kaggle kernels push -p ./kaggle-worker/
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      - name: Log success
        run: echo "✅ Kaggle kernel triggered successfully at $(date -u)"

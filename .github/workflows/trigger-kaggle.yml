name: Auto-Trigger Kaggle Video Worker

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          if [ -z "${{ secrets.KAGGLE_API_TOKEN }}" ]; then
            echo "::error::KAGGLE_API_TOKEN secret is empty! Please add it to Repository Secrets."
            exit 1
          fi
          
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/access_token ~/.kaggle/kaggle.json

      - name: Push and trigger Kaggle kernel
        run: |
          SETTINGS=$(curl -s "https://simplyytr.vercel.app/api/settings")
          USE_GPU=$(echo "$SETTINGS" | jq -r '.settings.useGpu // false')
          echo "Vercel settings useGpu is: $USE_GPU"
          
          if [ "$USE_GPU" = "true" ]; then
            echo "Enabling GPU inside Kaggle metadata..."
            jq '.enable_gpu = "true"' ./kaggle-worker/kernel-metadata.json > temp.json && mv temp.json ./kaggle-worker/kernel-metadata.json
          else
            echo "Disabling GPU (using CPU fallback) inside Kaggle metadata..."
            jq '.enable_gpu = "false"' ./kaggle-worker/kernel-metadata.json > temp.json && mv temp.json ./kaggle-worker/kernel-metadata.json
          fi
          
          cat ./kaggle-worker/kernel-metadata.json
          kaggle kernels push -p ./kaggle-worker/
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_CONFIG_DIR: ~/.kaggle

      - name: Log success
        run: echo "✅ Kaggle kernel triggered successfully at $(date -u)"

name: Auto-Trigger Kaggle Video Worker

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          if [ -z "${{ secrets.KAGGLE_API_TOKEN }}" ]; then
            echo "::error::KAGGLE_API_TOKEN secret is empty! Please add it to Repository Secrets."
            exit 1
          fi
          
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Push and trigger Kaggle kernel
        run: kaggle kernels push -p ./kaggle-worker/
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      - name: Log success
        run: echo "✅ Kaggle kernel triggered successfully at $(date -u)"
